[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "castguard"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Reproducible October 2 CastGuard experiment gate"

[tool.setuptools.packages.find]
include = ["castguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
